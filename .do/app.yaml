# DigitalOcean App Platform — the live `apex` app (serves apexwraplab.com).
#
# This spec REPLACES the source of the existing app, which previously built the
# hand-written static site from iovmada/ApexWrapLab. Mirrors the live spec as of
# 2026-09-05 with only the source and build fields changed.
#
# Three things here are load-bearing and must not be "tidied":
#
#  1. static_sites[0].name MUST stay `apexwraplab`. ingress.rules[].component.name
#     points at it; renaming the component breaks routing to the domains.
#  2. environment_slug MUST be node-js, not html. The `html` slug is the plain
#     static buildpack with no Node toolchain — it cannot run npm, so the build
#     command would never execute and the deploy would publish nothing.
#  3. The domains block must stay intact or apexwraplab.com detaches from the app.
#
# Apply with:  doctl apps update <app-id> --spec .do/app.yaml
# Or: DO control panel → Apps → apex → Settings → App Spec → Edit
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: apexwraplab.com
    type: PRIMARY
    zone: apexwraplab.com
  - domain: www.apexwraplab.com
    type: ALIAS
    zone: apexwraplab.com

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - component:
        name: apexwraplab
      match:
        authority:
          exact: ''
        path:
          prefix: /

name: apex
region: fra

static_sites:
  - name: apexwraplab
    # was: html — that buildpack has no Node and cannot run the build command
    environment_slug: node-js

    github:
      branch: main
      deploy_on_push: true
      repo: iovmada/apex-site

    source_dir: /

    # Every route is a client component with no server APIs, so --prerender-all
    # renders both pages at build time and this stays a static site on the free
    # tier. build-static.mjs merges vinext's split output into out/.
    build_command: npm run build:static
    output_dir: /out

    index_document: index.html
    # Real prerendered 404 exists, and both routes (/ and /shop) are real files,
    # so unmatched paths should 404 rather than be rewritten to index.html.
    error_document: 404.html

# Node version comes from "engines" (>=22.13.0) in package.json. vinext fails on
# older majors with `SyntaxError: Unexpected token '??='`.
