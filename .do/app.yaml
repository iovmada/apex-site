# DigitalOcean App Platform — static site (free Starter tier).
#
# This is the React/vinext rebuild of ApexWrapLab. It ships as a *static* site
# rather than a service: every route is a client component with no server APIs,
# so `vinext build --prerender-all` can render both pages to HTML at build time
# and nothing needs to run per-request. That keeps it on the free tier and off
# the Cloudflare Workers runtime vinext targets by default.
#
# scripts/build-static.mjs merges vinext's split output (client assets in
# dist/client, prerendered HTML in dist/server/prerendered-routes) into out/.
#
# This REPLACES the source of the existing `apexwraplab` app, which previously
# built from iovmada/ApexWrapLab (the hand-written static site). The app name,
# region and component name are kept identical so DO updates the app in place
# rather than tearing it down and recreating it.
#
# Apply with:  doctl apps update <app-id> --spec .do/app.yaml
# Or: DO control panel → Apps → apexwraplab → Settings → App Spec → Edit
#
# ⚠ The live spec may carry a `domains:` block added through the UI that is not
# reproduced here. Preserve whatever the live spec shows, or saving this will
# detach apexwraplab.com from the app.

name: apexwraplab
region: fra                        # Frankfurt — nearest region to RO

static_sites:
  - name: preview                  # kept from the old spec — renaming recreates it
    github:
      repo: iovmada/apex-site
      branch: main
      deploy_on_push: true         # every push to main redeploys

    build_command: npm run build:static
    output_dir: /out

    index_document: index.html

    # There is a real prerendered 404 page, so unmatched paths should land on it
    # rather than being rewritten to index.html. Both real routes (/ and /shop)
    # exist as static files, so no catchall is needed.
    error_document: 404.html

# Node version comes from "engines" in package.json (>=22.13.0). vinext will not
# run on older majors, so do not let the buildpack fall back to a default.

# domains: intentionally omitted — see the warning above. Copy the block from the
# live spec verbatim if one is present there.
